<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Готовая еда по КБЖУ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Telegram Mini App: colours follow the user's Telegram theme, with own fallbacks */
:root{
  --bg:var(--tg-theme-bg-color,#f6f8f5);
  --surface:var(--tg-theme-section-bg-color,var(--tg-theme-secondary-bg-color,#ffffff));
  --fg:var(--tg-theme-text-color,#1b2420);
  --muted:var(--tg-theme-hint-color,#5f6d66);
  --line:color-mix(in srgb,var(--muted) 25%,transparent);
  --accent:var(--tg-theme-button-color,#2f6b4f);
  --on-accent:var(--tg-theme-button-text-color,#ffffff);
  --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --good:#2e8a55; --mid:#b07a00; --bad:#c2412f;
  --good-bg:color-mix(in srgb,var(--good) 15%,transparent);
  --mid-bg:color-mix(in srgb,var(--mid) 16%,transparent);
  --bad-bg:color-mix(in srgb,var(--bad) 14%,transparent);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.btn{font:inherit;font-weight:600;border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent);padding:6px 10px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.row2{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.row2 select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:4px 6px}
.row2 .count{margin-left:auto}
main{padding:10px 12px 40px;display:grid;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.card.found{outline:2px solid var(--accent)}
.head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.name{font-weight:600;font-size:15.5px}
a.dish{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a.dish::after{content:" ↗";font-size:.8em;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.g{color:var(--good);background:var(--good-bg)} .y{color:var(--mid);background:var(--mid-bg)} .r{color:var(--bad);background:var(--bad-bg)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-variant-numeric:tabular-nums;text-align:center}
.nums b{display:block;font-family:var(--mono);font-size:15px}
.nums span{font-size:11px;color:var(--muted)}
.why{font-size:13px;color:var(--muted)}
.chk{font-size:12px;color:var(--muted)}
.chk.old{color:var(--mid);font-weight:600}
.code{display:flex;gap:8px;align-items:center}
.code input{flex:1;min-width:0;font-family:var(--mono);font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.code input.saved{border-color:var(--good)}
.tag{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.banner{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.foot{font-size:12px;color:var(--muted);padding:0 2px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scanner{position:fixed;inset:0;z-index:20;background:#000;display:grid;grid-template-rows:1fr auto}
.scanner video{width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;left:10%;right:10%;top:38%;height:22%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanner .bar{background:#000;color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.scanner .bar .btn{padding:10px 16px}

/* ---------- diary ---------- */
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);padding:8px 0 9px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current=page]{color:var(--accent);font-weight:600}
.pad{padding:10px 12px 24px;display:grid;gap:10px}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav b{font-size:16px}
.icon{font:inherit;font-size:20px;line-height:1;border:0;background:var(--accent-soft);color:var(--accent);width:36px;height:36px;border-radius:10px;cursor:pointer}
.icon:disabled{opacity:.35}
.sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .in b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.ring .in span{font-size:11.5px;color:var(--muted)}
.bars{display:grid;gap:9px}
.bar1 .lbl{display:flex;justify-content:space-between;font-size:13px}
.bar1 .lbl span{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.track i.over{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.mood{text-align:center;font-size:14.5px;padding:9px 4px 1px;border-top:1px solid var(--line);margin-top:-2px}
.kpis b{display:block;font-family:var(--mono);font-size:15px;color:var(--fg)}
.meal .mh{display:flex;align-items:center;gap:8px}
.meal .mh .t{font-weight:600;flex:1}
.meal .mh .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{font:inherit;font-size:20px;line-height:1;border:0;background:var(--accent);color:var(--on-accent);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none}
.ent{display:flex;gap:10px;align-items:center;padding:8px 0 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%}
.ent .n{flex:1;min-width:0}
.ent .n div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .k{font-family:var(--mono);font-size:14px;white-space:nowrap}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:34px;height:40px;border:2px solid var(--accent);border-radius:4px 4px 9px 9px;background:none;cursor:pointer;padding:0;position:relative;overflow:hidden}
.cup.on{background:color-mix(in srgb,#3a8fd9 70%,transparent);border-color:#3a8fd9}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.week .c{display:grid;gap:4px;justify-items:center;height:100%;align-content:end;font-size:11px;color:var(--muted)}
.week .c i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.week .c i.over{background:var(--bad)}
.week .c i.none{background:var(--line)}
.week .c.today{color:var(--fg);font-weight:600}
.wk{position:relative}
.wk .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.7}
.h2{font-weight:600;font-size:15.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.h2 span{font-weight:400;font-size:13px;color:var(--muted)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.btn.big{padding:12px 16px;font-size:16px;width:100%}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.addbtn{font:inherit;font-size:14px;font-weight:600;border:0;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;cursor:pointer;justify-self:start}
.pickbar{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:14px}
.pickbar b{flex:1}
.sheetWrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet .ttl{font-weight:600;font-size:17px;padding-right:36px}
.sheet .x{position:absolute;right:12px;top:12px}
.calc{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px;font-size:11.5px;color:var(--muted)}
.calc b{display:block;font-family:var(--mono);font-size:16px;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:90vw;pointer-events:none}
.spark{width:100%;height:70px}
.wlist{display:grid;gap:2px;font-size:14px;font-variant-numeric:tabular-nums}
.wlist div{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}

/* =================== Liquid glass =================== */
:root{
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.34);
  --rim:rgba(255,255,255,.75); --rim-low:rgba(255,255,255,.18);
  --shadow:0 10px 30px -12px rgba(20,40,30,.28),0 2px 6px -2px rgba(20,40,30,.10);
  --blur:blur(28px) saturate(190%); --glass-float:rgba(250,252,251,.74);
  --b1:color-mix(in srgb,var(--accent) 55%,#7fe0b0); --b2:#7cc8ff; --b3:#ffc09a; --b4:#cdb8ff; --base:#eaf1ed;
  --line:rgba(60,80,70,.16);
}
html[data-scheme=dark]{
  --fg:var(--tg-theme-text-color,#eef2ef); --muted:var(--tg-theme-hint-color,#9aa7a0); --accent:var(--tg-theme-button-color,#4fb985); --on-accent:var(--tg-theme-button-text-color,#06130d);
  --surface:var(--tg-theme-section-bg-color,#1a1e22); --good:#4fc47f; --mid:#e0a832; --bad:#ff6b57;
  --glass:rgba(40,44,52,.46); --glass-strong:rgba(44,48,56,.70); --glass-soft:rgba(255,255,255,.07);
  --rim:rgba(255,255,255,.22); --rim-low:rgba(255,255,255,.04); --glass-float:rgba(28,31,37,.78);
  --shadow:0 12px 32px -12px rgba(0,0,0,.7),0 2px 6px -2px rgba(0,0,0,.4);
  --b1:color-mix(in srgb,var(--accent) 60%,#0d3b2a); --b2:#14365c; --b3:#4a2a22; --b4:#2c2356; --base:#0b0e12;
  --line:rgba(255,255,255,.12);
}
body{background:var(--base);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 30% at 12% 8%,var(--b1),transparent 70%),
    radial-gradient(34% 28% at 92% 18%,var(--b2),transparent 70%),
    radial-gradient(40% 32% at 85% 78%,var(--b3),transparent 70%),
    radial-gradient(36% 30% at 8% 70%,var(--b4),transparent 70%),
    var(--base)}
/* glass recipe: translucent fill, bright top rim, soft drop shadow */
.card,.banner,.top,.nav,.sheet,.toast,.chip,.btn.ghost,.addbtn,.icon,.pickbar,.calc,
.search input,.row2 select,.form input,.form select,.code input{
  background:var(--glass);border:1px solid var(--rim-low);
  box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 var(--rim-low),var(--shadow)}
.card,.banner{border-radius:24px;padding:14px 16px}
/* only floating layers blur what scrolls beneath them (keeps long lists fast) */
.top,.nav,.sheet,.toast,.pickbar{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.top,.nav{background:var(--glass-float)}
.top{margin:8px 10px 0;border-radius:26px;top:8px;padding:10px 12px;border-bottom:1px solid var(--rim-low)}
.chips{margin:0 -12px;padding:2px 12px 4px}
.chip{border-radius:999px;color:var(--fg);box-shadow:inset 0 1px 0 var(--rim),0 1px 3px rgba(0,0,0,.06)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 82%,transparent);color:var(--on-accent);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.search input,.form input,.form select,.row2 select,.code input{border-radius:16px;background:var(--glass-soft);box-shadow:inset 0 1px 2px rgba(0,0,0,.06),inset 0 -1px 0 var(--rim-low)}
.btn{border-radius:999px;position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff) 0%,var(--accent) 55%,color-mix(in srgb,var(--accent) 88%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.12),0 6px 16px -6px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn.ghost,.addbtn,.icon{color:var(--accent);background:var(--glass-strong)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,var(--glass-strong));color:var(--bad);box-shadow:inset 0 1px 0 var(--rim),var(--shadow)}
.icon{border-radius:50%}
.addbtn{border-radius:999px;padding:8px 14px}
.add{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -5px color-mix(in srgb,var(--accent) 80%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 85%,#fff),var(--accent))}
.pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.pickbar{border-radius:18px;background:color-mix(in srgb,var(--accent) 14%,var(--glass))}
main{padding:12px 10px 40px;gap:12px}
.pad{padding:12px 10px 24px;gap:12px}
.dnav{background:var(--glass);border-radius:999px;padding:5px;box-shadow:inset 0 1px 0 var(--rim),var(--shadow);border:1px solid var(--rim-low)}
.dnav .icon{box-shadow:none;background:var(--glass-strong)}
.calc{border-radius:16px;background:var(--glass-soft);box-shadow:inset 0 1px 0 var(--rim-low)}
.track{background:color-mix(in srgb,var(--fg) 10%,transparent)}
.track i,.week .c i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#9ff0c8),var(--accent))}
.week .c i{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 65%,#9ff0c8),var(--accent))}
.track i.over,.week .c i.over{background:var(--bad)}
.week .c i.none{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.ent{border-top:1px solid var(--line)}
.cup{border-radius:6px 6px 12px 12px;border-color:color-mix(in srgb,#3a8fd9 55%,transparent);background:var(--glass-soft)}
.cup{width:36px;height:44px;border-width:2px;transform:translateZ(0)}
.cup.on{background:var(--glass-soft);border-color:#3a8fd9;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
/* water: a wide slab whose top edge is the surface; it rotates around the surface centre
   so the surface stays level when the phone tilts (--tilt is set from the motion sensor) */
.wat{position:absolute;left:-70%;width:240%;height:220%;top:108%;transform-origin:50% 0;
  transform:rotate(var(--tilt,0deg));background:linear-gradient(180deg,rgba(150,214,255,.95) 0,#4aa3ec 14%,#2f86d6 40%);
  transition:top .7s cubic-bezier(.3,1.35,.5,1);will-change:transform}
.wat::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.75);filter:blur(.4px)}
.cup.on .wat{top:30%}
/* an empty cup hides its water once it has drained, so strong shaking can't swing a corner into view */
.cup:not(.on) .wat{top:150%;visibility:hidden;transition:top .45s ease-in,visibility 0s .45s}
.cup::after{content:"";position:absolute;top:3px;bottom:5px;left:4px;width:4px;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));pointer-events:none}
/* floating capsule tab bar */
.nav{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:5px;border-radius:30px;gap:4px;border-top:1px solid var(--rim-low)}
.nav button{border-radius:24px;padding:7px 0}
.nav button{position:relative;z-index:1;transition:color .3s}
.nav button[aria-current=page]{background:none}
.nav button svg{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.nav button[aria-current=page] svg{transform:translateY(-1px) scale(1.12)}
/* sliding glass pill under the active tab */
.nav .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 18px)/3);z-index:0;pointer-events:none;
  transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform .55s cubic-bezier(.34,1.32,.5,1)}
.nav .ind i{position:absolute;inset:0;border-radius:24px;background:color-mix(in srgb,var(--accent) 16%,var(--glass-strong));
  box-shadow:inset 0 1px 0 var(--rim),0 2px 8px -3px color-mix(in srgb,var(--accent) 40%,transparent)}
.nav .ind.go i{animation:squish .55s cubic-bezier(.3,.9,.4,1)}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.18,.9)}65%{transform:scale(.97,1.03)}100%{transform:scale(1,1)}}
/* the page slides in from the side of the tab you came from */
.view.enter{animation:viewIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateX(calc(var(--dir,0) * 18px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.nav .ind,.nav button svg{transition:none}.nav .ind.go i,.view.enter{animation:none}}
/* sheet floats above the content too */
.sheetWrap{background:rgba(0,0,0,.25);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet{border-radius:30px;background:var(--glass-strong);padding:18px 16px 18px}
.toast{background:var(--glass-strong);color:var(--fg);border-radius:999px;padding:10px 18px;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.ring circle:first-child{stroke:color-mix(in srgb,var(--fg) 10%,transparent)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .top,.nav,.sheet,.toast,.pickbar{background:var(--glass-strong)} }
@media (prefers-reduced-transparency:reduce){
  .card,.banner,.top,.nav,.sheet,.toast{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none} }
</style>
</head>
<body>
<section class="view" id="vDiary"><div class="pad" id="diary"></div></section>
<section class="view" id="vMe" hidden><div class="pad" id="me"></div></section>
<section class="view" id="vFood" hidden>
<div class="top">
  <div class="pickbar" id="pickbar" hidden><b id="pickTxt"></b><button class="btn ghost" id="customBtn" type="button">Своё блюдо</button><button class="btn ghost" id="pickCancel" type="button">Отмена</button></div>

  const c=(group,v,label)=>`<button class="chip" data-g="${group}" data-v="${esc(v)}" aria-pressed="${st[group]===v}">${esc(label)}</button>`;
  return c('store','','Все')+stores.map(s=>c('store',s,s)).join('')+'<span class="sep"></span>'+
    c('cat','','Любые блюда')+cats.map(([v,l])=>c('cat',v,l)).join('')+'<span class="sep"></span>'+
    c('rate','','Любая оценка')+c('rate','g','Полезно')+c('rate','y','Умеренно')+c('rate','r','Реже');
}
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('.eat'); if(b){ openDish(BYID[b.dataset.id]); return; } const a=e.target.closest('a.dish'); if(a&&inTg){ e.preventDefault(); try{tg.openLink(a.href);}catch(err){window.open(a.href,'_blank');} }});
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip'); if(!b)return; st[b.dataset.g]=b.dataset.v; render();});
document.getElementById('sort').addEventListener('change',e=>{st.sort=e.target.value; render();});
document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value; status=''; render();});

function isCodeQuery(){const q=st.q.replace(/\s/g,''); return q.length>=4 && digits(q).length===q.length;}
function matches(d){
  if(st.store&&d.store!==st.store)return false;
  if(st.cat&&d.cat!==st.cat)return false;
  if(st.rate&&d.r!==st.rate)return false;
  const q=st.q.trim().toLowerCase(); if(!q)return true;
  if(isCodeQuery()) return (idCodes[d.id]||[]).some(c=>c.includes(digits(q)));
  return (d.name+' '+(d.note||'')+' '+d.store+' '+(d.why||'')).toLowerCase().includes(q);
}
const SORT={
  r:d=>(RANK[d.r]??3)*1e4+(d.kp||d.k||0)/1e3,
  P:d=>-(portion(d,d.p)||0),
  kp:d=>d.w?d.kp:d.k*3,
  price:d=>d.price,
  pp:d=>pp(d)??1e9,
  name:d=>d.name
};
function card(d,found){
  const per=d.w?'':'<div class="sub">Вес не указан, значения на 100 г</div>';
  return `<article class="card${found?' found':''}">
    <div class="head"><div><div class="name">${d.url?`<a class="dish" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a>`:esc(d.name)}${d.frz?'<span class="tag">заморозка</span>':''}</div>
      <div class="sub">${d.note&&!d.note.includes(d.store)?esc(d.note)+' · ':''}${esc(d.store)} · ${fmt(d.w)}&nbsp;г</div></div>
      ${d.r?`<span class="pill ${d.r}">${LABEL[d.r]}</span>`:''}</div>
    <div class="nums">
      <div><b>${fmt(d.w?d.kp:d.k)}</b><span>ккал</span></div>
      <div><b>${fmt(portion(d,d.p))}</b><span>белки</span></div>
      <div><b>${fmt(portion(d,d.f))}</b><span>жиры</span></div>
      <div><b>${fmt(portion(d,d.c))}</b><span>углев.</span></div>
      <div><b>${fmt(d.price)}</b><span>₽</span></div>
    </div>${per}
    ${d.why?`<div class="why">${esc(d.why)}</div>`:''}
    ${chkHTML(d)}
    <button class="addbtn eat" type="button" data-id="${esc(d.id)}">+ ${pick!=null?'В '+MEALS[pick].toLowerCase():'Съел'}</button>
  </article>`;
}
function render(){
  document.getElementById('chips').innerHTML=chipsHTML();
  const list=DATA.filter(matches);
  const key=SORT[st.sort];
  list.sort((a,b)=>{const x=key(a),y=key(b); return typeof x==='string'?x.localeCompare(y,'ru'):x-y;});
  const qd=digits(st.q); const exact=isCodeQuery()&&qd.length>=8;
  let html='';
  if(pick!=null && !st.q.trim()){ const rec=recentDishes(); if(rec.length) html+=`<div class="h2" style="padding:2px 2px 0">Недавние</div>`+rec.map(d=>card(d,false)).join('')+`<div class="h2" style="padding:6px 2px 0">Все блюда</div>`; }
  if(status) html+=`<div class="banner">${esc(status)}</div>`;
  if(exact&&!list.length) html+=`<div class="banner">Товара со штрихкодом <b>${esc(qd)}</b> пока нет в базе. Попробуйте найти его по названию.</div>`;
  html+= list.length ? list.map(d=>card(d,exact&&(CODES[qd]||[]).includes(d.id))).join('') :
    (exact?'':`<div class="empty">Ничего не нашлось. Попробуйте другое слово или сбросьте фильтры.</div>`);
  html+=`<p class="foot">Блюда нет в списке? <button class="btn ghost" type="button" onclick="openCustom()">Добавить своё блюдо</button></p><p class="foot">Ккал и БЖУ указаны на всю упаковку. Данные с сайтов магазинов, дата проверки указана у каждого блюда. Оценка ориентировочная и не заменяет совет врача.</p>`;
  document.getElementById('list').innerHTML=html;
  document.getElementById('count').textContent=`${list.length} из ${DATA.length}`;
  document.getElementById('sort').value=st.sort;
}
function showCode(code){
  st.q=code; st.store=st.cat=st.rate=''; status='';
  document.getElementById('q').value=code;
  haptic(CODES[code]?'success':'warning');
  render(); window.scrollTo(0,0);
}

/* ---------- scanning: live camera, photo as a fallback ---------- */
let zx=null;
function loadZXing(){ if(window.ZXing) return Promise.resolve();
  return zx ||= new Promise((ok,fail)=>{const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=ok; s.onerror=()=>{zx=null;fail();}; document.head.appendChild(s);}); }
function hints(){ const h=new Map(); const F=ZXing.BarcodeFormat;
  h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.ITF]); h.set(ZXing.DecodeHintType.TRY_HARDER,true); return h; }
const scanner=document.getElementById('scanner'), video=document.getElementById('video');
let stream=null, timer=null, mfr=null, detector=null;
const canvas=document.createElement('canvas'), ctx2d=canvas.getContext('2d',{willReadFrequently:true});
function stopScan(){
  clearTimeout(timer); timer=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null; scanner.hidden=true;
  updateBack();
}
async function grab(){
  if(!stream) return;
  if(video.readyState>=2 && video.videoWidth){
    const s=Math.min(1, 960/video.videoWidth);
    canvas.width=Math.round(video.videoWidth*s); canvas.height=Math.round(video.videoHeight*s);
    ctx2d.drawImage(video,0,0,canvas.width,canvas.height);
    let code=null;
    if(detector){ try{ const r=await detector.detect(canvas); if(r[0]) code=r[0].rawValue; }catch(e){ detector=null; } }
    if(!code && mfr){ try{
      const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)));
      code=mfr.decodeWithState(bmp).getText(); }catch(e){ mfr.reset(); } }
    if(code && stream){ stopScan(); showCode(digits(code)||code); return; }
  }
  timer=setTimeout(grab, 200);
}
async function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ return askPhoto(); }
  try{ await loadZXing(); mfr=new ZXing.MultiFormatReader(); mfr.setHints(hints()); }catch(e){ mfr=null; }
  try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('ean_13')) detector=new BarcodeDetector({formats:f.filter(x=>/ean|upc|code_128|itf/.test(x))}); } }catch(e){ detector=null; }
  if(!mfr && !detector){ status='Не удалось загрузить сканер. Введите цифры штрихкода в поиск.'; render(); return; }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    status='Камера недоступна: Telegram или телефон не дали к ней доступ. Сфотографируйте штрихкод, сейчас откроется камера для фото.';
    render(); askPhoto(); return;
  }
  scanner.hidden=false; status=''; render();
  updateBack();
  video.srcObject=stream; try{ await video.play(); }catch(e){}
  grab();
}
document.getElementById('closeScan').onclick=stopScan;
document.getElementById('scanBtn').onclick=startScan;

const photo=document.getElementById('photo');
function askPhoto(){ photo.value=''; photo.click(); }
async function decodePhoto(file){
  if('BarcodeDetector' in window){ try{ const r=await new BarcodeDetector().detect(await createImageBitmap(file)); if(r[0]) return digits(r[0].rawValue)||r[0].rawValue; }catch(e){} }
  await loadZXing();
  const url=URL.createObjectURL(file);
  try{ const res=await new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageUrl(url); return digits(res.getText())||res.getText(); }
  finally{ URL.revokeObjectURL(url); }
}
photo.addEventListener('change',async()=>{
  const f=photo.files[0]; if(!f)return;
  status='Распознаю штрихкод…'; render();
  let code=null; try{ code=await decodePhoto(f); }catch(e){}
  if(!code){ status='Штрихкод не распознан. Снимите его ближе, ровно и при хорошем свете или введите цифры в поиск.'; haptic('error'); render(); return; }
  showCode(code);
});

/* =====================================================================
   Food diary. Each Telegram user has their own data in Telegram
   CloudStorage (synced across their devices); outside Telegram the
   browser's localStorage is used instead.
   Keys: prof (profile), wt (weight log), rc (recent dish ids),
         d_YYYY-MM-DD (one day: entries + water).
   Entry: [meal, dishId, name, grams|null, k, p, f, c]
          grams!=null -> k,p,f,c are per 100 g; grams==null -> per portion.
   ===================================================================== */
const KV={
  cloud: inTg && !!tg.CloudStorage && typeof tg.isVersionAtLeast==='function' && tg.isVersionAtLeast('6.9'),
  get(keys){ return new Promise(res=>{
    if(this.cloud){ try{ tg.CloudStorage.getItems(keys,(e,v)=>res(e?{}:(v||{}))); }catch(e){ res({}); } return; }
    const o={}; for(const k of keys){ try{ o[k]=localStorage.getItem('cpfc_'+k)||''; }catch(e){ o[k]=''; } } res(o); }); },
  set(k,v){ return new Promise(res=>{
    if(this.cloud){ try{ v===''?tg.CloudStorage.removeItem(k,e=>res(!e)):tg.CloudStorage.setItem(k,v,e=>res(!e)); }catch(e){ res(false); } return; }
    try{ v===''?localStorage.removeItem('cpfc_'+k):localStorage.setItem('cpfc_'+k,v); }catch(e){} res(true); }); }
};
const parse=(s,def)=>{ try{ return s?JSON.parse(s):def; }catch(e){ return def; } };
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY=()=>ymd(new Date());
const MON=['янв.','фев.','мар.','апр.','мая','июн.','июл.','авг.','сен.','окт.','нояб.','дек.'];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function dayTitle(s){ const d=new Date(s+'T12:00:00'), t=TODAY();
  const base=`${d.getDate()} ${MON[d.getMonth()]}`;
  return s===t?'Сегодня, '+base : s===addDays(t,-1)?'Вчера, '+base : WD[d.getDay()]+', '+base; }

const plural=(n,a,b,c)=>{ const m=n%10,h=n%100; return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c; };
const S={ prof:null, wt:{}, rc:[], days:{}, date:TODAY(), view:'vDiary' };
const day=s=>S.days[s]||(S.days[s]={e:[],w:0});
async function saveDay(s){ const d=day(s); const v=(d.e.length||d.w)?JSON.stringify(d):'';
  if(v.length>4000){ toast('В этом дне слишком много записей, удалите лишние'); return false; }
  return KV.set('d_'+s,v); }
const saveProf=()=>KV.set('prof',JSON.stringify(S.prof));
function saveWt(){ const ks=Object.keys(S.wt).sort(); while(ks.length>180) delete S.wt[ks.shift()]; return KV.set('wt',JSON.stringify(S.wt)); }

async function loadAll(){
  const keys=['prof','wt','rc']; for(let i=0;i<35;i++) keys.push('d_'+addDays(TODAY(),-i));
  const v=await KV.get(keys);
  S.prof=parse(v.prof,null); S.wt=parse(v.wt,{}); S.rc=parse(v.rc,[]);
  for(const k of keys) if(k.startsWith('d_')&&v[k]) S.days[k.slice(2)]=parse(v[k],{e:[],w:0});
}
async function ensureDay(s){ if(S.days[s]) return; const v=await KV.get(['d_'+s]); S.days[s]=parse(v['d_'+s],{e:[],w:0}); }

/* ---------- daily norm: Mifflin–St Jeor ---------- */
const ACT=[[1.2,'Почти без движения'],[1.375,'Лёгкая: 1–3 тренировки в неделю'],[1.55,'Средняя: 3–5 тренировок'],[1.725,'Высокая: 6–7 тренировок'],[1.9,'Очень высокая: физическая работа и спорт']];
const GOAL={lose:['Похудеть',0.85],keep:['Держать вес',1],gain:['Набрать массу',1.1]};
function curWeight(){ const ks=Object.keys(S.wt).sort(); return ks.length?S.wt[ks[ks.length-1]]:(S.prof&&S.prof.kg); }
function norm(){
  const p=S.prof; if(!p) return null;
  const kg=curWeight()||p.kg;
  const bmr=10*kg+6.25*p.cm-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.act;
  let k=Math.round(tdee*GOAL[p.goal][1]/10)*10;
  const floor=p.sex==='m'?1500:1200;
  if(k<floor) k=floor;
  if(p.kOver) k=p.kOver;
  const P=Math.round(kg*(p.goal==='keep'?1.4:1.8)), F=Math.round(kg*0.9);
  const C=Math.max(0,Math.round((k-P*4-F*9)/4));
  return {k,p:P,f:F,c:C,bmr:Math.round(bmr),tdee:Math.round(tdee),water:Math.round(kg*30/250)};
}
const eK=e=>{ const m=e[3]==null?1:e[3]/100; return {k:e[4]*m,p:e[5]*m,f:e[6]*m,c:e[7]*m}; };
function totals(s,meal){ const t={k:0,p:0,f:0,c:0}; for(const e of day(s).e) if(meal==null||e[0]===meal){ const v=eK(e); for(const x in t) t[x]+=v[x]; } return t; }

/* ---------- views ---------- */
const TABS=['vDiary','vFood','vMe'];
function show(v){
  const from=TABS.indexOf(S.view), to=TABS.indexOf(v);
  const ind=document.querySelector('#nav .ind'); ind.style.setProperty('--i',to);
  if(from!==to){ ind.classList.remove('go'); void ind.offsetWidth; ind.classList.add('go');
    const el=document.getElementById(v); el.style.setProperty('--dir',to>from?1:-1); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
  S.view=v;
  for(const id of ['vDiary','vFood','vMe']) document.getElementById(id).hidden=id!==v;
  for(const b of document.querySelectorAll('#nav button')) b.setAttribute('aria-current',b.dataset.v===v?'page':'false');
  if(v!=='vFood' && pick!=null){ pick=null; renderPick(); }
  if(v==='vDiary'){ renderDiary(); Slosh.start(); } else { Slosh.stop(); if(v==='vMe') renderMe(); else render(); }
  window.scrollTo(0,0); updateBack();
}
document.getElementById('nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); });

function ring(eaten,goal){
  const r=52, L=2*Math.PI*r, f=goal?Math.min(eaten/goal,1):0, over=goal&&eaten>goal;
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/>
    ${f>0?`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${over?'var(--bad)':'var(--accent)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${f*L} ${L}"/>`:''}</svg>
    <div class="in">${goal?`<b>${fmt(Math.abs(goal-eaten))}</b><span>${over?'ккал сверх нормы':'ккал осталось'}</span>`:`<b>${fmt(eaten)}</b><span>ккал</span>`}</div></div>`;
}
function bar(lbl,v,goal){ const f=goal?Math.min(v/goal,1)*100:0;
  return `<div class="bar1"><div class="lbl">${lbl}<span>${fmt(v)}${goal?' / '+fmt(goal):''} г</span></div><div class="track"><i class="${goal&&v>goal*1.1?'over':''}" style="width:${f}%"></i></div></div>`; }

function renderDiary(){
  const s=S.date, n=norm(), t=totals(s), d=day(s);
  let h=`<div class="dnav"><button class="icon" data-act="prev" aria-label="Предыдущий день">‹</button><b>${dayTitle(s)}</b><button class="icon" data-act="next" aria-label="Следующий день" ${s>=TODAY()?'disabled':''}>›</button></div>`;
  if(!n) h+=`<div class="banner">Заполните профиль, и приложение посчитает вашу дневную норму калорий и БЖУ. <button class="btn ghost" data-act="prof">Заполнить</button></div>`;
  h+=`<div class="card"><div class="sum">${ring(t.k,n&&n.k)}<div class="bars">${bar('Белки',t.p,n&&n.p)}${bar('Жиры',t.f,n&&n.f)}${bar('Углеводы',t.c,n&&n.c)}</div></div>
    <div class="kpis"><div><b>${fmt(n?n.k:null)}</b>норма</div><div><b>${fmt(t.k)}</b>съедено</div><div><b>${fmt(d.e.length)}</b>${plural(d.e.length,'запись','записи','записей')}</div></div>
    <div class="mood">${moodLine(t.k,n?n.k:2000,s)}</div></div>`;
  MEALS.forEach((m,i)=>{
    const es=d.e.map((e,j)=>[e,j]).filter(([e])=>e[0]===i), mt=totals(s,i);
    h+=`<div class="card meal"><div class="mh"><span class="t">${m}</span><span class="s">${es.length?fmt(mt.k)+' ккал':''}</span><button class="add" data-act="add" data-m="${i}" aria-label="Добавить в ${m.toLowerCase()}">+</button></div>
      ${es.map(([e,j])=>{ const v=eK(e); return `<button class="ent" type="button" data-act="edit" data-j="${j}"><div class="n"><div>${esc(e[2])}</div><div class="sub">${e[3]==null?'1 порция':fmt(e[3])+' г'} · Б ${fmt(v.p)} · Ж ${fmt(v.f)} · У ${fmt(v.c)}</div></div><span class="k">${fmt(v.k)}</span></button>`; }).join('')}</div>`;
  });
  const wg=n?n.water:8, cups=Math.max(wg,d.w);
  h+=`<div class="card"><div class="h2">Вода <span id="waterTxt">${fmt(d.w*0.25,2)} из ${fmt(wg*0.25,2)} л · стакан 250 мл</span></div><div class="cups">${Array.from({length:cups},(_,i)=>`<button class="cup${i<d.w?' on':''}" data-act="cup" data-i="${i}" aria-label="Стакан ${i+1}"><i class="wat"></i></button>`).join('')}<button class="icon" data-act="cupAdd" aria-label="Ещё стакан">+</button></div></div>`;
  h+=weekHTML(n);
  h+=`<p class="foot">Норма считается по формуле Миффлина — Сан-Жеора и даёт ориентир, а не медицинскую рекомендацию.</p>`;
  document.getElementById('diary').innerHTML=h;
}
function weekHTML(n){
  const days=Array.from({length:7},(_,i)=>addDays(S.date,i-6));
  const vals=days.map(s=>S.days[s]?totals(s).k:0);
  const max=Math.max(n?n.k*1.25:0,...vals,1);
  const filled=vals.filter(v=>v>0), avg=filled.length?filled.reduce((a,b)=>a+b,0)/filled.length:0;
  return `<div class="card"><div class="h2">7 дней <span>${filled.length?'в среднем '+fmt(avg)+' ккал':'пока нет записей'}</span></div>
    <div class="wk"><div class="week">${days.map((s,i)=>{ const v=vals[i], hgt=v?Math.max(3,v/max*100):3, d=new Date(s+'T12:00:00');
      return `<div class="c${s===S.date?' today':''}"><i class="${!v?'none':n&&v>n.k*1.1?'over':''}" style="height:${hgt}px" title="${fmt(v)} ккал"></i>${WD[d.getDay()]}</div>`; }).join('')}</div>
    ${n?`<div class="goal" style="bottom:${n.k/max*100+17}px" title="норма"></div>`:''}</div>
    ${n?'<div class="muted">Пунктир — ваша норма, красным дни с перебором больше 10%</div>':''}</div>`;
}
document.getElementById('diary').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, d=day(S.date);
  if(a==='prev'||a==='next'){ S.date=addDays(S.date,a==='prev'?-1:1); if(S.date>TODAY()) S.date=TODAY(); await ensureDay(S.date); renderDiary(); }
  else if(a==='prof') show('vMe');
  else if(a==='add'){ pick=+b.dataset.m; st.q=''; document.getElementById('q').value=''; renderPick(); show('vFood'); }
  else if(a==='edit') openEntry(+b.dataset.j);
  else if(a==='cup'){ const i=+b.dataset.i; d.w=d.w===i+1?i:i+1; haptic('success');
    document.querySelectorAll('#diary .cup').forEach((c,k)=>c.classList.toggle('on',k<d.w));
    const n=norm(), wg=n?n.water:8; document.getElementById('waterTxt').textContent=`${fmt(d.w*0.25,2)} из ${fmt(wg*0.25,2)} л · стакан 250 мл`;
    Slosh.kick(); Slosh.ask(); saveDay(S.date); }
  else if(a==='cupAdd'){ d.w++; renderDiary(); Slosh.kick(); saveDay(S.date); }
});

/* ---------- choosing a dish ---------- */
function renderPick(){
  const pb=document.getElementById('pickbar'); pb.hidden=pick==null;
  if(pick!=null) document.getElementById('pickTxt').textContent='Добавляете в: '+MEALS[pick].toLowerCase();
}
document.getElementById('pickCancel').onclick=()=>{ pick=null; renderPick(); show('vDiary'); };
document.getElementById('customBtn').onclick=()=>openCustom();
const recentDishes=()=>S.rc.map(id=>BYID[id]).filter(Boolean).slice(0,6);
const mealByClock=()=>{ const h=new Date().getHours(); return h<11?0:h<16?1:h<21?2:3; };

/* ---------- bottom sheet ---------- */
const wrap=document.getElementById('sheetWrap'), sheet=document.getElementById('sheet');
function openSheet(html){ sheet.innerHTML=`<button class="icon x" data-x aria-label="Закрыть">×</button>`+html; wrap.hidden=false; updateBack(); }
function closeSheet(){ wrap.hidden=true; sheet.innerHTML=''; updateBack(); }
wrap.addEventListener('click',e=>{ if(e.target===wrap||e.target.closest('[data-x]')) closeSheet(); });
const segHTML=(m)=>`<div class="seg" id="mealSeg">${MEALS.map((x,i)=>`<button type="button" class="chip" data-m="${i}" aria-pressed="${i===m}">${x}</button>`).join('')}</div>`;
function bindSeg(get,set){ document.getElementById('mealSeg').onclick=e=>{ const b=e.target.closest('[data-m]'); if(!b) return; set(+b.dataset.m);
  for(const c of document.querySelectorAll('#mealSeg .chip')) c.setAttribute('aria-pressed',c===b); }; }
const calcHTML=v=>`<div class="calc"><div><b>${fmt(v.k)}</b>ккал</div><div><b>${fmt(v.p,1)}</b>белки</div><div><b>${fmt(v.f,1)}</b>жиры</div><div><b>${fmt(v.c,1)}</b>углев.</div></div>`;
const num=v=>{ const x=parseFloat(String(v).replace(',','.')); return isFinite(x)?x:null; };

/* add a catalog dish, or edit an existing entry (j) */
function openDish(dsh,j){
  const ent=j!=null?day(S.date).e[j]:null;
  const base=ent?{name:ent[2],k:ent[4],p:ent[5],f:ent[6],c:ent[7],w:dsh?dsh.w:null,store:dsh?dsh.store:''}:{name:dsh.name,k:dsh.k,p:dsh.p,f:dsh.f,c:dsh.c,w:dsh.w,store:dsh.store};
  let meal=ent?ent[0]:(pick!=null?pick:mealByClock()), g=ent?ent[3]:(base.w||100);
  const quick=base.w?[[base.w,'Вся упаковка'],[Math.round(base.w/2),'Половина']]:[];
  openSheet(`<div class="ttl">${esc(base.name)}</div><div class="muted">${esc(base.store)}${base.w?' · упаковка '+fmt(base.w)+' г':''} · на 100 г: ${fmt(base.k)} ккал</div>
    ${segHTML(meal)}
    <div class="form"><label>Сколько съели, г<input id="gIn" type="number" inputmode="decimal" min="1" value="${g}"></label></div>
    ${quick.length?`<div class="seg">${quick.map(([v,l])=>`<button type="button" class="chip" data-g="${v}">${l} · ${fmt(v)} г</button>`).join('')}</div>`:''}
    <div id="calc"></div>
    <button class="btn big" id="ok" type="button">${ent?'Сохранить':'Добавить в дневник'}</button>
    ${ent?'<button class="btn big danger" id="del" type="button">Удалить запись</button>':''}`);
  const gIn=document.getElementById('gIn'), upd=()=>{ const x=num(gIn.value)||0, m=x/100; document.getElementById('calc').innerHTML=calcHTML({k:base.k*m,p:base.p*m,f:base.f*m,c:base.c*m}); };
  upd(); gIn.oninput=upd; bindSeg(()=>meal,v=>meal=v);
  sheet.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ gIn.value=b.dataset.g; upd(); });
  document.getElementById('ok').onclick=()=>{ const x=num(gIn.value); if(!x||x<=0){ gIn.focus(); return; }
    const e=[meal,dsh?dsh.id:(ent?ent[1]:''),base.name.slice(0,60),Math.round(x),base.k,base.p||0,base.f||0,base.c||0];
    commit(e,j); };
  if(ent) document.getElementById('del').onclick=()=>removeEntry(j);
}
/* a dish that is not in the catalog: values per portion */
function openCustom(j){
  const ent=j!=null?day(S.date).e[j]:null;
  let meal=ent?ent[0]:(pick!=null?pick:mealByClock());
  const v=ent?eK(ent):{k:'',p:'',f:'',c:''};
  openSheet(`<div class="ttl">${ent?'Изменить запись':'Своё блюдо'}</div><div class="muted">Значения на всю порцию, которую вы съели. Их можно взять с упаковки.</div>
    ${segHTML(meal)}
    <div class="form"><label>Название<input id="cn" type="text" maxlength="60" value="${esc(ent?ent[2]:'')}" placeholder="Например, домашний борщ"></label>
    <label>Калории, ккал<input id="ck" type="number" inputmode="decimal" value="${ent?Math.round(v.k):''}"></label>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)"><label>Белки, г<input id="cp" type="number" inputmode="decimal" value="${ent?+v.p.toFixed(1):''}"></label><label>Жиры, г<input id="cf" type="number" inputmode="decimal" value="${ent?+v.f.toFixed(1):''}"></label><label>Углев., г<input id="cc" type="number" inputmode="decimal" value="${ent?+v.c.toFixed(1):''}"></label></div></div>
    <button class="btn big" id="ok" type="button">${ent?'Сохранить':'Добавить в дневник'}</button>
    ${ent?'<button class="btn big danger" id="del" type="button">Удалить запись</button>':''}`);
  bindSeg(()=>meal,x=>meal=x);
  document.getElementById('ok').onclick=()=>{
    const n=document.getElementById('cn').value.trim(), k=num(document.getElementById('ck').value);
    if(!n){ document.getElementById('cn').focus(); return; } if(k==null||k<0){ document.getElementById('ck').focus(); return; }
    const g=id=>Math.max(0,num(document.getElementById(id).value)||0);
    commit([meal,'',n,null,k,g('cp'),g('cf'),g('cc')],j); };
  if(ent) document.getElementById('del').onclick=()=>removeEntry(j);
}
function openEntry(j){ const e=day(S.date).e[j]; if(e[3]==null) openCustom(j); else openDish(BYID[e[1]]||null,j); }

async function commit(e,j){
  const d=day(S.date);
  if(j!=null) d.e[j]=e; else d.e.push(e);
  if(e[1]){ S.rc=[e[1],...S.rc.filter(x=>x!==e[1])].slice(0,20); KV.set('rc',JSON.stringify(S.rc)); }
  const ok=await saveDay(S.date);
  if(ok===false){ if(j==null) d.e.pop(); return; }
  haptic('success'); closeSheet();
  toast(j!=null?'Запись обновлена':`Добавлено: ${MEALS[e[0]].toLowerCase()}, ${fmt(eK(e).k)} ккал`);
  if(pick!=null){ pick=null; renderPick(); show('vDiary'); } else if(S.view==='vDiary') renderDiary();
}
async function removeEntry(j){ day(S.date).e.splice(j,1); await saveDay(S.date); haptic('warning'); closeSheet(); renderDiary(); toast('Запись удалена'); }

let toastT=null;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2200); }

/* ---------- profile & weight ---------- */
function renderMe(){
  const p=S.prof||{sex:'f',age:'',cm:'',kg:'',act:1.375,goal:'keep'}, n=norm();
  const ks=Object.keys(S.wt).sort();
  let h=`<div class="card"><div class="h2">Ваши данные <span>${KV.cloud?'хранятся в Telegram':'хранятся в этом браузере'}</span></div><div class="form">
    <div class="seg" id="sexSeg"><button type="button" class="chip" data-s="f" aria-pressed="${p.sex==='f'}">Женщина</button><button type="button" class="chip" data-s="m" aria-pressed="${p.sex==='m'}">Мужчина</button></div>
    <div class="grid2" style="grid-template-columns:repeat(3,1fr)"><label>Возраст<input id="pAge" type="number" inputmode="numeric" min="14" max="100" value="${p.age}"></label><label>Рост, см<input id="pCm" type="number" inputmode="numeric" min="120" max="230" value="${p.cm}"></label><label>Вес, кг<input id="pKg" type="number" inputmode="decimal" min="35" max="250" value="${curWeight()||p.kg}"></label></div>
    <label>Активность<select id="pAct">${ACT.map(([v,l])=>`<option value="${v}" ${+p.act===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>Цель<select id="pGoal">${Object.entries(GOAL).map(([v,[l]])=>`<option value="${v}" ${p.goal===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label>Своя норма калорий (необязательно)<input id="pOver" type="number" inputmode="numeric" placeholder="посчитать автоматически" value="${p.kOver||''}"></label>
    <button class="btn big" id="pSave" type="button">Сохранить</button></div></div>`;
  if(n) h+=`<div class="card"><div class="h2">Ваша норма в день</div>${calcHTML(n)}
    <div class="muted">Обмен веществ в покое ${fmt(n.bmr)} ккал, с учётом активности ${fmt(n.tdee)} ккал. ${S.prof.kOver?'Сейчас стоит ваша собственная норма.':S.prof.goal==='lose'?'Для похудения взят дефицит 15%.':S.prof.goal==='gain'?'Для набора взят профицит 10%.':''} Белок ${S.prof.goal==='keep'?'1,4':'1,8'} г и жиры 0,9 г на кг веса, остальное углеводы.</div></div>`;
  h+=`<div class="card"><div class="h2">Вес <span>${ks.length?ks.length+' '+plural(ks.length,'запись','записи','записей'):''}</span></div>
    <div class="form"><div class="grid2" style="grid-template-columns:1fr auto;align-items:end"><label>Вес сегодня, кг<input id="wIn" type="number" inputmode="decimal" step="0.1" value="${S.wt[TODAY()]||''}"></label><button class="btn" id="wSave" type="button" style="height:42px">Записать</button></div></div>
    ${ks.length>1?spark(ks):''}
    ${ks.length?`<div class="wlist">${ks.slice(-7).reverse().map((k,i,a)=>{ const prev=ks[ks.length-2-i]; const df=prev!=null?S.wt[k]-S.wt[prev]:null;
      return `<div><span>${dayTitle(k)}</span><span>${fmt(S.wt[k],1)} кг${df?` <span class="muted">${df>0?'+':''}${fmt(df,1)}</span>`:''}</span></div>`; }).join('')}</div>`:'<div class="muted">Записывайте вес раз в несколько дней, утром натощак. Норма калорий пересчитается сама.</div>'}</div>`;
  document.getElementById('me').innerHTML=h;
  let sex=p.sex;
  document.getElementById('sexSeg').onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return; sex=b.dataset.s; for(const c of document.querySelectorAll('#sexSeg .chip')) c.setAttribute('aria-pressed',c===b); };
  document.getElementById('pSave').onclick=async()=>{
    const age=num(pAge.value), cm=num(pCm.value), kg=num(pKg.value), over=num(pOver.value);
    const bad=[[age,14,100,pAge],[cm,120,230,pCm],[kg,35,250,pKg]].find(([v,a,b])=>v==null||v<a||v>b);
    if(bad){ bad[3].focus(); toast('Проверьте возраст, рост и вес'); return; }
    const prevKg=curWeight();
    S.prof={sex,age,cm,kg,act:+pAct.value,goal:pGoal.value,kOver:over&&over>=800?Math.round(over):null};
    if(kg!==prevKg||!Object.keys(S.wt).length){ S.wt[TODAY()]=kg; await saveWt(); }
    await saveProf(); haptic('success'); toast('Сохранено, норма пересчитана'); renderMe();
  };
  document.getElementById('wSave').onclick=async()=>{ const v=num(wIn.value); if(!v||v<30||v>300){ wIn.focus(); return; }
    S.wt[TODAY()]=Math.round(v*10)/10; await saveWt(); if(S.prof){ S.prof.kg=S.wt[TODAY()]; saveProf(); } haptic('success'); toast('Вес записан'); renderMe(); };
}
function spark(ks){
  const pts=ks.slice(-30), v=pts.map(k=>S.wt[k]), lo=Math.min(...v)-0.5, hi=Math.max(...v)+0.5;
  const x=i=>pts.length===1?150:i/(pts.length-1)*290+5, y=w=>62-(w-lo)/(hi-lo)*54;
  return `<svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-label="График веса"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${v.map((w,i)=>x(i)+','+y(w)).join(' ')}"/></svg>
    <div class="muted" style="display:flex;justify-content:space-between"><span>${fmt(v[0],1)} кг</span><span>${v[v.length-1]-v[0]>0?'+':''}${fmt(v[v.length-1]-v[0],1)} кг за период</span><span>${fmt(v[v.length-1],1)} кг</span></div>`;
}

/* ---------- a playful line about how much was eaten, relative to the norm ---------- */
const MOOD=[  // [share of the norm up to, variants]; {Day} is "Сегодня" or "В этот день", {ел} agrees with the profile's sex
  [0,    ['Пока пусто. Самое время что-нибудь съесть 🍳','Тарелка ждёт первую запись 🍽️']],
  [0.15, ['{Day} ты покушал{а} как уточка 🦆','{Day} ты клюёшь как воробушек 🐦']],
  [0.35, ['Перекус хомячка засчитан 🐹','{Day} ты поел{а} как котик из мисочки 🐱']],
  [0.6,  ['Половина пути, как у панды к полднику 🐼','{Day} ты поел{а} как зайчик, морковка за морковкой 🐰']],
  [0.85, ['Почти у цели, как лиса после охоты 🦊','Ещё немного, и будешь сыт{а} как медвежонок 🐻']],
  [1.1,  ['В самую точку, как довольный кот 😺','Идеально! Сыт{а} как пингвин после рыбалки 🐧']],
  [1.3,  ['Чуть больше нормы, по-медвежьи 🐻','{Day} ты поел{а} как енот у холодильника 🦝']],
  [9e9,  ['{Day} у тебя пир, как у хомяка перед зимой 🐹','Праздник живота, как у бегемота на пикнике 🦛']]
];
function moodLine(eaten,goal,s){
  const r=eaten<=0?0:eaten/goal, row=MOOD.find(([up])=>eaten<=0?up===0:up>0&&r<=up);
  const v=row[1], h=[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%v.length;   // same phrase all day, no flicker
  const f=S.prof&&S.prof.sex==='f';
  return esc(v[h].replace('{Day}',s===TODAY()?'Сегодня':'В этот день').replace(/\{а\}/g,f?'а':'')); }

/* ---------- water slosh: damped spring towards the tilt reported by the motion sensor ---------- */
const Slosh=(()=>{
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let target=0, ang=0, vel=0, raf=0, last=0, started=false, asked=false;
  const host=()=>document.getElementById('diary');
  function fromGravity(x,y,z){            // readings point "up"; screen-plane angle of the up vector
    const s=y<0?-1:1, inPlane=Math.hypot(x,y), all=Math.hypot(x,y,z)||1;
    let a=Math.atan2(s*x,s*y)*180/Math.PI;
    a*=Math.min(1,inPlane/all/0.55);      // lying flat: gravity is into the screen, so barely any tilt
    target=Math.max(-32,Math.min(32,a)); wake(); }
  function step(t){
    const dt=Math.min(0.05,(t-(last||t))/1000)||0.016; last=t;
    const acc=170*(target-ang)-7*vel;     // under-damped: overshoots a little, then settles
    vel+=acc*dt; ang+=vel*dt;
    if(Math.abs(ang)>40){ ang=Math.sign(ang)*40; vel*=-0.3; }   // hard shaking: bounce off a limit
    const el=host(); if(el) el.style.setProperty('--tilt',ang.toFixed(2)+'deg');
    if(Math.abs(target-ang)<0.05&&Math.abs(vel)<0.05){ raf=0; last=0; return; }
    raf=requestAnimationFrame(step); }
  function wake(){ if(!still&&!raf&&S.view==='vDiary'&&!document.hidden) raf=requestAnimationFrame(step); }
  function start(){
    if(started||still) return; started=true;
    if(inTg&&tg.Accelerometer&&tg.isVersionAtLeast&&tg.isVersionAtLeast('8.0')){
      try{ tg.onEvent('accelerometerChanged',()=>fromGravity(tg.Accelerometer.x||0,tg.Accelerometer.y||0,tg.Accelerometer.z||0));
           tg.Accelerometer.start({refresh_rate:40}); return; }catch(e){} }
    window.addEventListener('devicemotion',e=>{ const g=e.accelerationIncludingGravity; if(g&&g.x!=null) fromGravity(g.x,g.y,g.z); });
  }
  return {
    start,
    kick(){ if(still) return; vel+=(Math.random()<.5?-1:1)*(90+Math.random()*60); wake(); },
    ask(){ // iPhone browsers ask permission for motion data, and only after a tap
      if(asked||inTg) return; asked=true;
      try{ if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().catch(()=>{}); }catch(e){} },
    stop(){ if(inTg&&started){ try{ tg.Accelerometer.stop(); }catch(e){} started=false; } }
  };
})();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Slosh.stop(); else if(S.view==='vDiary') Slosh.start(); });

/* ---------- Telegram back button: scanner > sheet > dish picking > other tab ---------- */
function onBack(){ if(!scanner.hidden) stopScan(); else if(!wrap.hidden) closeSheet(); else if(pick!=null){ pick=null; renderPick(); show('vDiary'); } else if(S.view!=='vDiary') show('vDiary'); }
function updateBack(){ if(!inTg) return; try{ (!scanner.hidden||!wrap.hidden||pick!=null||S.view!=='vDiary')?tg.BackButton.show():tg.BackButton.hide(); }catch(e){} }
if(inTg){ try{ tg.BackButton.onClick(onBack); }catch(e){} }

(async()=>{ document.getElementById('diary').innerHTML='<div class="empty">Загружаю дневник…</div>';
  await loadAll(); renderDiary(); render(); Slosh.start(); })();
